spring:
  application:
    name: ai_agent
  datasource:
    url: jdbc:h2:mem:llmdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    openai:
      chat:
        model: gpt-4o-mini
